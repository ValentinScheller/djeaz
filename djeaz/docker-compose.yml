# PostgreSQL local : une instance, deux bases distinctes.
# djeaz_dev persiste dans le volume. Remise à zéro de djeaz_test, sans toucher à djeaz_dev :
#   docker compose exec postgres dropdb --if-exists --force -U djeaz djeaz_test
#   docker compose exec postgres createdb -U djeaz djeaz_test
# Identifiants uniquement locaux.

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: djeaz
      POSTGRES_PASSWORD: djeaz
      POSTGRES_DB: djeaz_dev
    ports:
      - "5432:5432"
    volumes:
      - djeaz_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djeaz -d djeaz_dev && pg_isready -U djeaz -d djeaz_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  djeaz_postgres_data:
